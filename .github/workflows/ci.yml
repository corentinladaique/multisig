name: CI

# CI minimale, sans aucun secret.
# Elle ne construit PAS Android, n'utilise AUCUN wallet, AUCUN RPC,
# ne lance JAMAIS les scripts *.check.ts et n'envoie AUCUNE transaction.
# Elle ne fait que : checkout, Node attendu, npm ci, tests purs, typecheck.

on:
  push:
    branches:
      - night/hackathon-prep
      - experiment/superpowers
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-tests-and-typecheck:
    name: Pure tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pure tests (no RPC, no wallet, no transaction)
        run: npm test

      - name: Typecheck
        run: npm run typecheck
